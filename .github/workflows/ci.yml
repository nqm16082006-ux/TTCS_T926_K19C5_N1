name: CI Pipeline (.NET 9)

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop, "feature/**" ]

jobs:
  ci-build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore EventTicketBooking.sln

      - name: Build Solution
        run: dotnet build EventTicketBooking.sln --no-restore --configuration Release

      - name: Check Code Formatting & Lint
        run: dotnet format EventTicketBooking.sln --verify-no-changes --verbosity diagnostic

      - name: Run Tests
        run: dotnet test EventTicketBooking.sln --no-build --configuration Release --verbosity normal

  # S-55: Offline tests for backup/restore/drill scripts (no DB, no Docker, no cloud credentials required)
  s55-offline-tests:
    name: S-55 Backup/DR Offline Tests (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run S-55 offline test suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/test-backup-retention-s55.ps1
          ./tests/test-s55-blockers-offline.ps1
          ./tests/test-s55-guards-offline.ps1
          ./tests/test-s55-phase3-offline.ps1
          ./tests/test-s55-docker-mode-offline.ps1
          Write-Host "TAT CA BO TEST S-55 OFFLINE DEU PASS."