name: CD - Deploy to Staging

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  packages: write


jobs:

  # =========================
  # 1. BUILD & PUSH IMAGE
  # =========================

  build-and-push:

    name: Build & Push Docker Image

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Extract Docker Metadata

        id: meta

        uses: docker/metadata-action@v5

        with:

          images: ghcr.io/${{ github.repository }}

          tags: |

            type=raw,value=staging

            type=sha,format=short



      - name: Build and Push Docker Image

        uses: docker/build-push-action@v5

        with:

          context: .

          file: ./Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}





  # =========================
  # 2. DEPLOY STAGING
  # =========================


  deploy-staging:


    name: Deploy to Staging & Health Check


    needs:

      - build-and-push



    runs-on: ubuntu-latest



    steps:



      - name: Checkout Code

        uses: actions/checkout@v4




      - name: Login GHCR

        run: |

          echo "${{ secrets.GITHUB_TOKEN }}" | \

          docker login ghcr.io \

          -u "${{ github.actor }}" \

          --password-stdin





      - name: Pull Docker Image


        run: |


          IMAGE="ghcr.io/${{ github.repository }}:staging"


          docker pull $IMAGE





      - name: Create Docker Network


        run: |


          docker network create event_ticket_staging_net || true






      - name: Deploy New Container


        run: |


          IMAGE="ghcr.io/${{ github.repository }}:staging"


          TEMP_CONTAINER="event_ticket_api_staging_new"


          OLD_CONTAINER="event_ticket_api_staging"



          echo "Stopping temporary container..."

          docker stop $TEMP_CONTAINER || true

          docker rm $TEMP_CONTAINER || true




          echo "Starting new container..."



          docker run -d \

            --name $TEMP_CONTAINER \

            --restart always \

            -p 5001:5000 \

            --network event_ticket_staging_net \

            -e ASPNETCORE_ENVIRONMENT=Staging \

            -e ConnectionStrings__DefaultConnection="Host=event_ticket_postgres_staging;Port=5432;Database=event_ticket_db;Username=postgres;Password=postgres_password_123" \

            -e ConnectionStrings__Redis="event_ticket_redis_staging:6379" \

            $IMAGE






      - name: Health Check New Container


        run: |


          echo "Waiting application startup..."

          sleep 15



          for i in {1..12}

          do


            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/health || true)



            echo "Health check $i : $STATUS"



            if [ "$STATUS" = "200" ]

            then

              echo "Health check passed"

              exit 0

            fi



            sleep 5


          done



          echo "Health check failed"


          docker logs event_ticket_api_staging_new


          exit 1






      - name: Swap Container


        run: |


          echo "Replace old container"



          docker stop event_ticket_api_staging || true

          docker rm event_ticket_api_staging || true



          docker rename event_ticket_api_staging_new event_ticket_api_staging



          echo "Deploy successful"






      - name: Rollback On Failure


        if: failure()


        run: |


          echo "Rollback"



          docker stop event_ticket_api_staging_new || true

          docker rm event_ticket_api_staging_new || true



          echo "Old container remains running"
