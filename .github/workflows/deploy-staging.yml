name: CD - Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================
  # 1. BUILD & PUSH IMAGE
  # =========================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Base
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =========================
  # 2. DEPLOY STAGING
  # =========================
  deploy-staging:
    name: Deploy to Staging & Health Check
    needs:
      - build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$REPO_LOWER:staging" >> $GITHUB_ENV

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_TAG

      - name: Start Staging Infrastructure (PostgreSQL & Redis)
        run: |
          docker compose -f docker-compose.staging.yml up -d postgres redis

      - name: Wait for Postgres & Redis Readiness
        run: |
          echo "Waiting for databases to be ready..."
          sleep 10

      - name: Deploy New Container
        run: |
          TEMP_CONTAINER="event_ticket_api_staging_new"

          docker stop $TEMP_CONTAINER || true
          docker rm $TEMP_CONTAINER || true

          NETWORK_NAME=$(docker inspect event_ticket_postgres_staging -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          if [ -z "$NETWORK_NAME" ]; then
            NETWORK_NAME="bridge"
          fi

          echo "Starting new container on network $NETWORK_NAME..."
          docker run -d \
            --name $TEMP_CONTAINER \
            --restart always \
            -p 5000:5000 \
            --network $NETWORK_NAME \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e ConnectionStrings__DefaultConnection="Host=event_ticket_postgres_staging;Port=5432;Database=event_ticket_db;Username=postgres;Password=postgres_password_123" \
            -e ConnectionStrings__Redis="event_ticket_redis_staging:6379" \
            $IMAGE_TAG

      - name: Health Check New Container
        run: |
          echo "Waiting for application startup..."
          sleep 10

          for i in {1..12}
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || true)
            echo "Health check attempt $i : $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED! App is running healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Health check FAILED!"
          docker logs event_ticket_api_staging_new
          exit 1

      - name: Swap Container
        run: |
          echo "Replacing old container..."
          docker stop event_ticket_api_staging || true
          docker rm event_ticket_api_staging || true
          docker rename event_ticket_api_staging_new event_ticket_api_staging
          echo "Deploy successful!"

      - name: Rollback On Failure
        if: failure()
        run: |
          echo "Rollback trigger - Cleaning up failed temporary container..."
          docker stop event_ticket_api_staging_new || true
          docker rm event_ticket_api_staging_new || true
          echo "Old container remains running."
