name: CD - Deploy to Staging

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging Server & Health Check
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy via SSH & Zero-Downtime Safe Swap
        uses: actions/checkout@v4
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e

            IMAGE_TAG="ghcr.io/${{ github.repository }}:staging"
            TEMP_PORT=5001
            PROD_PORT=5000

            echo "=== 1. Log in to Registry & Pull Latest Image ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull $IMAGE_TAG

            echo "=== 2. Launch New Container on Temp Port ($TEMP_PORT) ==="
            docker stop event_ticket_api_staging_new 2>/dev/null || true
            docker rm event_ticket_api_staging_new 2>/dev/null || true

            docker run -d \
              --name event_ticket_api_staging_new \
              -p $TEMP_PORT:5000 \
              --network event_ticket_staging_net \
              -e ASPNETCORE_ENVIRONMENT=Staging \
              -e ConnectionStrings__DefaultConnection="Host=event_ticket_postgres_staging;Port=5432;Database=event_ticket_db;Username=postgres;Password=postgres_password_123" \
              -e ConnectionStrings__Redis="event_ticket_redis_staging:6379" \
              $IMAGE_TAG

            echo "=== 3. Performing Health Check on /api/health ==="
            HEALTH_SUCCESS=false
            MAX_RETRIES=12

            for i in $(seq 1 $MAX_RETRIES); do
              echo "Health check attempt $i/$MAX_RETRIES..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$TEMP_PORT/api/health || true)
              
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "✅ Container mới đã Healthy (HTTP 200 OK)!"
                HEALTH_SUCCESS=true
                break
              fi
              
              sleep 5
            done

            if [ "$HEALTH_SUCCESS" = true ]; then
              echo "=== 4. Health Check PASSED: Swapping Containers ==="
              docker stop event_ticket_api_staging 2>/dev/null || true
              docker rm event_ticket_api_staging 2>/dev/null || true
              
              docker stop event_ticket_api_staging_new
              docker rm event_ticket_api_staging_new

              docker run -d \
                --name event_ticket_api_staging \
                --restart always \
                -p $PROD_PORT:5000 \
                --network event_ticket_staging_net \
                -e ASPNETCORE_ENVIRONMENT=Staging \
                -e ConnectionStrings__DefaultConnection="Host=event_ticket_postgres_staging;Port=5432;Database=event_ticket_db;Username=postgres;Password=postgres_password_123" \
                -e ConnectionStrings__Redis="event_ticket_redis_staging:6379" \
                $IMAGE_TAG

              echo "🎉 Deploy thành công lên Staging!"
            else
              echo "❌ Health Check FAILED! Container mới không thể phục vụ dịch vụ."
              echo "=== ROLLBACK: Giữ nguyên container cũ đang chạy ==="
              docker stop event_ticket_api_staging_new 2>/dev/null || true
              docker rm event_ticket_api_staging_new 2>/dev/null || true
              exit 1
            fi
