<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống - Event Ticket Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: rgba(22, 30, 49, 0.75);
      --border-card: rgba(255, 255, 255, 0.08);
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.4);
      --danger-text: #fca5a5;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-border: rgba(245, 158, 11, 0.4);
      --warning-text: #fcd34d;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-border: rgba(16, 185, 129, 0.4);
      --success-text: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1e38 0%, var(--bg-primary) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.1);
      transition: all 0.3s ease;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 14px;
      color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.85);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 20px -3px rgba(99, 102, 241, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .alert-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    .alert-warning {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .demo-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .demo-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .demo-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-chip:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: #ffffff;
    }

    /* Logged In View */
    .logged-in-view {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .user-profile {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .profile-label {
      color: var(--text-muted);
    }

    .profile-value {
      font-weight: 500;
      color: #ffffff;
    }

    .role-badge {
      display: inline-block;
      background: #4338ca;
      color: #e0e7ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .token-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
      max-height: 90px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <div class="brand-badge">⚡ Event Ticket Booking</div>
        <h1 class="title">Đăng Nhập</h1>
        <p class="subtitle">Nhập thông tin tài khoản để truy cập hệ thống</p>
      </div>

      <!-- Alert Boxes -->
      <div id="alertBox" class="alert"></div>

      <!-- Login Form View -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Địa chỉ Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" required placeholder="admin@eventticket.com" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Đăng Nhập</span>
        </button>

        <div class="demo-accounts">
          <div class="demo-title">Điền nhanh tài khoản kiểm thử</div>
          <div class="demo-buttons">
            <button type="button" class="demo-chip" onclick="fillAccount('admin@eventticket.com', 'Admin@123456')">👑 Admin</button>
            <button type="button" class="demo-chip" onclick="fillAccount('organizer@eventticket.com', 'Organizer@123456')">🎪 Organizer</button>
            <button type="button" class="demo-chip" onclick="fillAccount('admin@eventticket.com', 'WrongPass_999')">❌ Mật khẩu sai</button>
          </div>
        </div>
      </form>

      <!-- Logged In Success View -->
      <div id="loggedInView" class="logged-in-view">
        <div class="user-profile">
          <div class="profile-row">
            <span class="profile-label">Người dùng:</span>
            <span class="profile-value" id="resFullName"></span>
          </div>
          <div class="profile-row">
            <span class="profile-label">Email:</span>
            <span class="profile-value" id="resEmail"></span>
          </div>
          <div class="profile-row">
            <span class="profile-label">Vai trò (RBAC):</span>
            <span class="profile-value" id="resRoles"></span>
          </div>
          <div style="margin-top: 12px;">
            <span class="profile-label" style="font-size: 12px;">JWT Access Token:</span>
            <div class="token-box" id="resToken"></div>
          </div>
        </div>

        <button type="button" class="action-btn" onclick="testRbacEndpoint()">🛡️ Thử gọi API Phân Quyền (T-06)</button>
        <div id="rbacResult" style="font-size: 12px; margin-bottom: 12px; padding: 8px; border-radius: 6px; display: none;"></div>
        <button type="button" class="action-btn btn-logout" onclick="logout()">Đăng xuất</button>
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loggedInView = document.getElementById('loggedInView');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const alertBox = document.getElementById('alertBox');

    function fillAccount(email, password) {
      emailInput.value = email;
      passwordInput.value = password;
      clearAlert();
    }

    function showAlert(message, type = 'danger') {
      alertBox.className = 'alert alert-' + type;
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    function clearAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    function setLoading(isLoading) {
      btnSubmit.disabled = isLoading;
      if (isLoading) {
        spinner.style.display = 'inline-block';
        btnText.textContent = 'Đang xác thực...';
      } else {
        spinner.style.display = 'none';
        btnText.textContent = 'Đăng Nhập';
      }
    }

    // Check if token already exists in localStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('access_token');
      const savedUser = localStorage.getItem('user_info');
      if (savedToken && savedUser) {
        try {
          renderLoggedIn(savedToken, JSON.parse(savedUser));
        } catch {
          localStorage.clear();
        }
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Vui lòng nhập đầy đủ Email và Mật khẩu.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          // HTTP 200: Đăng nhập thành công
          localStorage.setItem('access_token', data.accessToken);
          localStorage.setItem('user_info', JSON.stringify(data.user));
          renderLoggedIn(data.accessToken, data.user);
        } else if (response.status === 423 || data.isLocked) {
          // HTTP 423: Tài khoản bị khóa tạm thời 15 phút trên Redis
          showAlert('⛔ ' + (data.message || 'Tài khoản của bạn đã bị khóa tạm thời trong 15 phút do nhập sai quá nhiều lần. Vui lòng thử lại sau.'), 'warning');
        } else {
          // HTTP 401 hoặc lỗi khác
          showAlert('❌ ' + (data.message || 'Email hoặc mật khẩu không chính xác.'), 'danger');
        }
      } catch (err) {
        showAlert('Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại đường truyền.', 'danger');
      } finally {
        setLoading(false);
      }
    });

    function renderLoggedIn(token, user) {
      clearAlert();
      loginForm.style.display = 'none';
      loggedInView.style.display = 'block';

      document.getElementById('resFullName').textContent = user.fullName || user.username;
      document.getElementById('resEmail').textContent = user.email;

      const rolesContainer = document.getElementById('resRoles');
      rolesContainer.innerHTML = '';
      (user.roles || []).forEach(role => {
        const span = document.createElement('span');
        span.className = 'role-badge';
        span.textContent = role;
        rolesContainer.appendChild(span);
      });

      document.getElementById('resToken').textContent = token;
    }

    async function testRbacEndpoint() {
      const token = localStorage.getItem('access_token');
      const rbacResult = document.getElementById('rbacResult');
      rbacResult.style.display = 'block';
      rbacResult.style.background = 'rgba(255, 255, 255, 0.05)';
      rbacResult.textContent = 'Đang gọi API /api/test-auth/admin-only...';

      try {
        const res = await fetch('/api/test-auth/admin-only', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok) {
          rbacResult.style.background = 'rgba(16, 185, 129, 0.2)';
          rbacResult.style.color = '#6ee7b7';
          rbacResult.textContent = '✅ Gọi thành công (HTTP 200): ' + JSON.stringify(json);
        } else {
          rbacResult.style.background = 'rgba(239, 68, 68, 0.2)';
          rbacResult.style.color = '#fca5a5';
          rbacResult.textContent = `❌ Lỗi (HTTP ${res.status}): ` + JSON.stringify(json);
        }
      } catch (e) {
        rbacResult.style.background = 'rgba(239, 68, 68, 0.2)';
        rbacResult.style.color = '#fca5a5';
        rbacResult.textContent = 'Lỗi kết nối API: ' + e.message;
      }
    }

    function logout() {
      localStorage.clear();
      loggedInView.style.display = 'none';
      loginForm.style.display = 'block';
      passwordInput.value = '';
      document.getElementById('rbacResult').style.display = 'none';
      showAlert('Bạn đã đăng xuất khỏi hệ thống.', 'success');
    }
  </script>
</body>
</html>
