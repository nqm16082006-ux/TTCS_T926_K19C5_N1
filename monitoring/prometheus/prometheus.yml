global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'event-ticket-api'
    scrape_interval: 10s
    bearer_token_file: /etc/prometheus/secrets/metrics_scrape_token
    static_configs:
      - targets: ['host.docker.internal:5012']
