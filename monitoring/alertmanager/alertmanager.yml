global:
  resolve_timeout: 5m

route:
  receiver: 'webhook-admin'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: 'webhook-admin'
    webhook_configs:
      - url: http://host.docker.internal:5012/api/system-alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alertmanager_webhook_token
